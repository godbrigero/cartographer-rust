[workspace]
resolver = "3"
members = ["crates/cartographer", "crates/cartographer-cloud", "crates/ceres","crates/sim", "crates/rosbag", "crates/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
# No `repository`: this port is not hosted at the upstream C++ repository
# (set it once the Rust repository is public).

[workspace.dependencies]
nalgebra = "0.35"
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
log = "0.4"
clap = { version = "4.5", features = ["derive"] }
cpu-time = "1"
num-traits = "0.2"
approx = "0.5"
proptest = "1"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support", "plotters"] }

[workspace.lints.rust]
unsafe_code = "deny"

[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
