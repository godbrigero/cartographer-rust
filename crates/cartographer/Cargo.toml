[package]
name = "cartographer-slam"
description = "Native Rust port of Google Cartographer (2D/3D SLAM)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/cartographer-slam"
readme = "README.md"
keywords = ["slam", "lidar", "robotics", "mapping", "localization"]
categories = ["science::robotics", "algorithms"]
# Exposes the absolute path of `proto/` to dependents' build scripts as
# `DEP_CARTOGRAPHER_PROTO_DIR` (see build.rs); cartographer-cloud uses it.
links = "cartographer"
# The library is imported as `cartographer` (see [lib]); the package is named
# `cartographer-slam` because `cartographer` is taken on crates.io.
include = [
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/examples/**/*.rs",
    "/benches/**/*.rs",
    "/proto/**/*.proto",
    "/configuration_files/*.lua",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "cartographer"
# Keep `cargo bench` to the criterion benches (the unit tests have no
# #[bench] functions).
bench = false

[dependencies]
ceres = { package = "cartographer-ceres", version = "0.1.0", path = "../ceres" }
nalgebra.workspace = true
prost.workspace = true
flate2.workspace = true
log.workspace = true
clap.workspace = true
cpu-time.workspace = true
num-traits.workspace = true
# Pure-Rust PNG encoder for `io::cairo`/`io::image` (replaces Cairo's PNG writer).
png = "0.18"

[build-dependencies]
prost-build.workspace = true
protox.workspace = true

[dev-dependencies]
approx.workspace = true
proptest.workspace = true
rand.workspace = true
# Unpublished (publish = false): path-only, so `cargo package` strips it.
cartographer-sim = { version = "0.1.0", path = "../sim" }
criterion.workspace = true

[[bench]]
name = "scan_matching"
harness = false

[[bench]]
name = "grid_insertion"
harness = false

[[bench]]
name = "optimization"
harness = false

[[bench]]
name = "local_slam"
harness = false

[lints]
workspace = true
