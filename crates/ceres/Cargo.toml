[package]
name = "cartographer-ceres"
description = "Focused pure-Rust port of the subset of Ceres Solver used by Cartographer"
version.workspace = true
edition.workspace = true
# Ported Ceres Solver code is BSD-3-Clause (LICENSE-CERES); the rest is
# Apache-2.0 like Cartographer (LICENSE). See NOTICE.
license = "Apache-2.0 AND BSD-3-Clause"
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/cartographer-ceres"
readme = "README.md"
keywords = ["least-squares", "optimization", "autodiff", "ceres", "solver"]
categories = ["mathematics", "science", "algorithms"]
include = [
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/DESIGN.md",
    "/LICENSE",
    "/LICENSE-CERES",
    "/NOTICE",
]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "ceres"

[dependencies]
nalgebra.workspace = true
# Must match the simba / num-traits / approx versions used by nalgebra 0.35.
simba = { version = "0.10", default-features = false, features = ["std"] }
num-traits = "0.2.19"
approx.workspace = true
# Pure-Rust sparse Cholesky (AMD ordering + supernodal LLT) for
# SPARSE_NORMAL_CHOLESKY. See DESIGN.md.
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }
# Pure-Rust libm (already a transitive dependency of faer): erf/erfc and the
# Bessel functions used by jet.h.
libm = "0.2.15"
log.workspace = true

[dev-dependencies]
proptest.workspace = true
rand.workspace = true

[lints]
workspace = true
