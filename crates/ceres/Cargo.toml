[package]
name = "cartographer-ceres"
description = "Focused pure-Rust port of the subset of Ceres Solver used by Cartographer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "ceres"

[dependencies]
nalgebra.workspace = true
# Must match the simba / num-traits / approx versions used by nalgebra 0.35.
simba = { version = "0.10", default-features = false, features = ["std"] }
num-traits = "0.2.19"
approx.workspace = true
# Pure-Rust sparse Cholesky (AMD ordering + supernodal LLT) for
# SPARSE_NORMAL_CHOLESKY. See DESIGN.md.
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }
# Pure-Rust libm (already a transitive dependency of faer): erf/erfc and the
# Bessel functions used by jet.h.
libm = "0.2.15"
log.workspace = true

[dev-dependencies]
proptest.workspace = true
rand.workspace = true

[lints]
workspace = true
